name: Bug report
description: Something crashes, errors, or behaves incorrectly (not a wrong SQL answer)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For **wrong SQL or a wrong result**, use the *Wrong answer* template instead.

        For a **security vulnerability**, do not open an issue — see
        [SECURITY.md](https://github.com/sxjalxo/dbbuddy/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / traceback
      description: |
        The full traceback. Running with `DBBUDDY_STRICT=1` surfaces errors that are
        otherwise silently recovered — worth trying before reporting.
      render: text

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine (planning / SQL compilation)
        - Backend API
        - Web UI
        - CLI
        - AI providers / Insights
        - Dashboards / charts
        - Auth / permissions
        - Migrations / setup
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DB Buddy version or commit
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Ubuntu 24.04, PostgreSQL 16, single uvicorn worker"
    validations:
      required: true
