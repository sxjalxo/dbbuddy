name: Integration (live databases)

# The dialect contract against real MySQL, PostgreSQL, and SQL Server.
#
# Deliberately not run on pull requests: it starts three database servers and
# takes minutes, and a flaky container start would block unrelated work. It runs
# nightly and on demand, so a genuine dialect regression is visible within a day
# without gating every PR on Docker.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live dialect suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install pymssql        # SQL Server driver, not in the default set

      - name: Start databases
        # --wait blocks until every service reports healthy; the compose file
        # defines a healthcheck per engine.
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        # Host ports and credentials come from docker-compose.test.yml; the test
        # module's defaults already match them (MYSQL_PORT 3307, PG_PORT 5433).
        # Redis is the exception: the compose file publishes it on 6380 to avoid
        # clashing with a local Redis, while the test default is 6379.
        env:
          REDIS_PORT: "6380"
        run: pytest -m integration -q

      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  dogfood-postgres:
    name: Dogfood correctness (PostgreSQL target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The correctness suites normally run against a SQLite shim: fast, no server,
    # and unable to grade the SQL itself. It declares the engine as MySQL and
    # rewrites the statement on the way through, so SQL that PostgreSQL rejects
    # can execute and return rows — which is how an aggregate quoted as an
    # identifier in ORDER BY shipped under eight green datasets.
    #
    # This runs the same suites against a real server with nothing rewritten. Its
    # first run found two more defects of the same kind: mixed-case identifiers
    # emitted unquoted (PostgreSQL folds them and the relation is not found), and
    # SUM over a text column.
    #
    # Generated datasets only — not because of the loader (rows stream in through
    # COPY now, so scale is no longer the obstacle) but because `employees` and
    # `airportdb` are built from large gitignored dumps that this job has no copy
    # of.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbbuddy
          POSTGRES_PASSWORD: dbbuddy
          POSTGRES_DB: postgres
        ports:
          - "5442:5432"
        options: >-
          --health-cmd "pg_isready -U dbbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        dataset: [erp, hospital, legacy, tpch, tpcds]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Dogfood ${{ matrix.dataset }}
        env:
          PYTHONIOENCODING: utf-8
          # Learning writes would make a run depend on the runs before it; the
          # suites are a correctness gate, not a demonstration of adaptation.
          DBBUDDY_DISABLE_LEARNING: "1"
          DOGFOOD_PG_HOST: 127.0.0.1
          DOGFOOD_PG_PORT: "5442"
          DOGFOOD_PG_USER: dbbuddy
          DOGFOOD_PG_PASSWORD: dbbuddy
        run: python scripts/dogfood/run.py --dataset ${{ matrix.dataset }} --target postgres
