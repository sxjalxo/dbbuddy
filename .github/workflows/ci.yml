name: CI

on:
  push:
    # Both names on purpose: the repository's default branch is `master`, while
    # every doc link and CONTRIBUTING already say `main`. Listing both means the
    # push build runs today and keeps running through a rename, instead of
    # silently matching nothing the way `[main]` alone did.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Pinned. An unpinned `pip install ruff` means an upstream release can turn
      # this job red on code nobody touched, which is what happened at 0.16.0.
      # Bump it deliberately, with whatever fixes the new version asks for.
      - run: pip install ruff==0.16.4
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test
        # DBBUDDY_STRICT=1 turns silently-recovered contract violations into
        # failures. Live-database tests are excluded by the addopts in
        # pyproject.toml; they run in integration.yml.
        env:
          DBBUDDY_STRICT: "1"
        run: pytest -q

  postgres:
    name: Tests (PostgreSQL application database)
    runs-on: ubuntu-latest
    # SQLite is the development default and what the `test` job above uses.
    # Production is PostgreSQL, and a green SQLite run does not prove the storage
    # constraints hold — length caps, NUL bytes in text, and cascade behaviour all
    # differ, and that gap has produced real misses before.
    #
    # Note the limit honestly: this covers the *application* database. The engine
    # bugs that only appear on PostgreSQL (an aggregate quoted as an identifier in
    # ORDER BY, say) need a PostgreSQL *query target*, which is what
    # integration.yml exercises.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbbuddy
          POSTGRES_PASSWORD: dbbuddy
          POSTGRES_DB: dbbuddy_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U dbbuddy -d dbbuddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test against PostgreSQL
        env:
          DBBUDDY_STRICT: "1"
          APP_DATABASE_URL: postgresql+psycopg2://dbbuddy:dbbuddy@localhost:5432/dbbuddy_test
        run: pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
