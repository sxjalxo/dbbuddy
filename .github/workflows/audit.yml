name: Dependency audit

# Known-vulnerability scan for both dependency trees.
#
# Nightly and on demand rather than per-PR, for the same reason the live-database
# suite is: an advisory published against a transitive dependency has nothing to do
# with the pull request in front of it, and blocking unrelated work on it trains
# people to ignore a red check. Here it is visible within a day and actionable on
# its own.
#
# `chromadb` and `onnxruntime` pull a wide transitive surface, which is most of the
# reason this exists.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      - name: Audit runtime dependencies
        # Resolves the floors in requirements.txt and audits what they resolve to.
        run: pip-audit -r requirements.txt --strict

  javascript:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit
        # High and above only: the frontend tree carries a long tail of low-severity
        # advisories in build-time packages, and failing on those would make this
        # check permanently red and therefore useless.
        run: npm audit --audit-level=high
